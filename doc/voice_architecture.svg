<text x="1064.0" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">512 dimensions</text>
<text x="1064.0" y="328.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">‖z‖₂ = 1</text>
<path d="M932 300H964" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
<text x="36" y="374" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#202020">Tensor order: time × frequency × channels. Batch dimension omitted; every stage halves time and frequency.</text>
<path d="M36 397H1164" fill="none" stroke="#b0b0b0" stroke-width="1" stroke-linejoin="round" />
<text x="36" y="436" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#202020">(b)</text>
<text x="76" y="436" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#202020">Residual stage</text>
<text x="76" y="463" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#505050">Same structure at all four stages; C = 64, 128, 256 or 512 output channels</text>
<rect x="36" y="490" width="200" height="94" rx="0" fill="#ffffff" stroke="#202020" stroke-width="1.5"/>
<text x="136.0" y="521.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#202020">Conv 5 × 5</text>
<text x="136.0" y="543.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">C filters; stride 2</text>
<text x="136.0" y="565.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">Same padding</text>
<rect x="268" y="490" width="200" height="94" rx="0" fill="#ffffff" stroke="#202020" stroke-width="1.5"/>
<text x="368.0" y="532.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#202020">BatchNorm</text>
<text x="368.0" y="554.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">Channel normalization</text>
<path d="M236 537H268" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="500" y="490" width="200" height="94" rx="0" fill="#ffffff" stroke="#202020" stroke-width="1.5"/>
