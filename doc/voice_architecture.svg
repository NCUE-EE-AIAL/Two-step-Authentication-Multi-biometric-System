<text x="600.0" y="317.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">512 units</text>
<path d="M468 300H500" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="732" y="256" width="200" height="88" rx="0" fill="#ffffff" stroke="#202020" stroke-width="1.5"/>
<text x="832.0" y="295.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#202020">L2 normalization</text>
<text x="832.0" y="317.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">z = h / ‖h‖₂</text>
