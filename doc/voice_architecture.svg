<text x="600.0" y="554.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">min(max(x, 0), 20)</text>
<path d="M468 537H500" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="732" y="490" width="200" height="94" rx="0" fill="#ffffff" stroke="#202020" stroke-width="1.5"/>
