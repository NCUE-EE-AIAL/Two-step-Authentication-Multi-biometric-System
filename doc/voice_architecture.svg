<text x="1054.0" y="801.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">Output: T × F × C</text>
<path d="M36 856H1164" fill="none" stroke="#b0b0b0" stroke-width="1" stroke-linejoin="round" />
<text x="36" y="895" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#202020">(d)</text>
<text x="76" y="895" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#202020">Training objective</text>
<text x="36" y="928" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#202020">Anchor a, same-speaker positive p, and different-speaker negative n share the encoder weights.</text>
<text x="600" y="964" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#202020">L = Σᵢ max[cos(aᵢ, nᵢ) − cos(aᵢ, pᵢ) + 0.1, 0]</text>
<text x="36" y="997" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#202020">32 triplets per batch (96 clips). Random triplets: epochs 0–20; hard-mined triplets: epochs 21–60.</text>
<text x="36" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#505050">Sources: src/models.py, src/triplet_loss.py, src/constants.py and train_voice.py. BN = batch normalization.</text>
