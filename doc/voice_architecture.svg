<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">ResCNN speaker encoder: architecture, residual blocks and training objective</title>
<desc id="desc">Panel a traces the 160 by 64 input through stages with 64, 128, 256 and 512 channels, temporal averaging, a 512-unit dense layer and L2 normalization. Panel b expands one downsampling stage. Panel c expands the three-convolution identity block with its skip connection. Panel d states cosine triplet loss for 32 triplets. Tensor dimensions omit batch size; white background is fixed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6.4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#202020"/></marker></defs>
<rect id="background" width="1200" height="1040" fill="#ffffff"/>
<text x="36" y="44" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#202020">(a)</text>
<text x="76" y="44" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#202020">Speaker encoder</text>
<text x="76" y="71" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#505050">Input: normalized 64-filter Fbank features, 160 frames (approximately 1.6 s)</text>
<rect x="36" y="104" width="200" height="96" rx="0" fill="#ffffff" stroke="#202020" stroke-width="1.5"/>
