<text x="1064.0" y="554.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">T/2 × F/2 × C</text>
<path d="M932 537H964" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" />
<path d="M36 609H1164" fill="none" stroke="#b0b0b0" stroke-width="1" stroke-linejoin="round" />
<text x="36" y="648" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#202020">(c)</text>
<text x="76" y="648" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#202020">Identity block</text>
<text x="76" y="675" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#505050">Spatial dimensions and channel count are preserved; all convolutions use stride 1.</text>
<text x="518" y="710" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202020">Identity shortcut</text>
